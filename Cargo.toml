[package]
name = "verus-vanity"
version = "0.5.0"
edition = "2021"

[dependencies]
clap = { version = "=4.4.18", features = ["derive"] }
rand = "0.8"
rand_chacha = "0.3"
k256 = { version = "0.13", default-features = false, features = ["arithmetic", "alloc"] }
ff = "0.13"
sha2 = { version = "0.10", features = ["asm-aarch64"] }
ripemd = "0.1"
bs58 = "0.5"
hex = "0.4"
num_cpus = "1.16"
core_affinity = "0.8"
qrcode = { version = "0.14", default-features = false }
zeroize = "=1.7.0"
base64ct = "=1.6.0"

# Aggressive release optimizations — matters a lot for a hot CPU-bound
# search loop like this one.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
